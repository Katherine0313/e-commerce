      description: |
        给指定标签批量绑定一组商品（tag-centric，对应的另一面是 POST /api/tags/products/{product_id}/tags）。
        单个、多个都走这一条接口，body 始终是 product_ids 数组。
        底层直接把商品的 products.tag_id 置为当前标签（一个商品最多一个标签，重复绑定会覆盖）。
      security:

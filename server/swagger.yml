          description: 活动结束时间，必须晚于 start_time，最终按 Unix 秒存储
          example: '2026-10-08 23:59:59'
        order_close_time:
          type: integer
          minimum: 1
          description: 未支付订单自动关闭时长，单位为秒
          example: 900
        limit_type:
          type: integer
          enum: [0, 1]
          description: 限购类型，0=不限购，1=每人限购
          example: 1
        limit_quantity:
          type: integer
          minimum: 1
          nullable: true
          description: 每人限购数量；不限购时必须为 null，限购时必须为正整数
          example: 3
        allow_full_discount:
          type: integer
          enum: [0, 1]
          description: 是否可叠加满减满折，0=不可用，1=可用
          example: 0
        allow_coupon:
          type: integer
          enum: [0, 1]
          description: 是否可叠加优惠券，0=不可用，1=可用
          example: 1

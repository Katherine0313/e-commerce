      type: object
      description: |
        「新增预警」时的候选项——还没配预警的商品基本信息。
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: 华为 Mate 60 Pro
        image:
          type: string
        product_id:
          type: integer
          description: 商品表 ID（POST 时传这个）
          example: 3
        stock:
          type: integer
          description: 当前库存数
          example: 72

    Promotion:
      type: object
      description: 促销活动完整响应；activity_status 根据当前时间动态计算，不存入数据库。
      required:
        - id
        - activity_name
        - start_time
        - end_time
        - order_close_time
        - limit_type
        - limit_quantity
        - allow_full_discount
        - allow_coupon
        - created_at
        - activity_status
      properties:
        id:
          type: integer
          minimum: 1
          readOnly: true
          description: 促销活动 ID
          example: 1
        activity_name:
          type: string
          description: 活动名称
          example: 国庆满减活动
        start_time:
          type: string
          description: 活动开始时间；数据库存 Unix 秒，响应格式为 YYYY-MM-DD HH:mm:ss
          example: '2026-10-01 00:00:00'
        end_time:
          type: string
          description: 活动结束时间；数据库存 Unix 秒，响应格式为 YYYY-MM-DD HH:mm:ss，必须晚于开始时间
          example: '2026-10-07 23:59:59'
        order_close_time:
          type: integer
          minimum: 1
          description: 未支付订单自动关闭时长，单位为秒；不是绝对时间戳
          default: 1800
          example: 1800
        limit_type:
          type: integer
          enum: [0, 1]
          description: 限购类型，0=不限购，1=每人限购
          default: 0
          example: 1
        limit_quantity:
          type: integer
          minimum: 1
          nullable: true
          description: 每人限购数量；limit_type=0 时必须为 null，limit_type=1 时必须为正整数
          example: 2
        allow_full_discount:
          type: integer
          enum: [0, 1]
          description: 是否可叠加满减满折，0=不可用，1=可用
          default: 0
          example: 1
        allow_coupon:
          type: integer
          enum: [0, 1]
          description: 是否可叠加优惠券，0=不可用，1=可用
          default: 0
          example: 1
        created_at:
          type: string
          readOnly: true
          description: 创建时间；数据库存 Unix 秒，响应格式为 YYYY-MM-DD HH:mm:ss
          example: '2026-09-07 10:00:00'
        updated_at:
          type: string
          nullable: true
          readOnly: true
          description: 最后更新时间；数据库存 Unix 秒，响应格式为 YYYY-MM-DD HH:mm:ss；未更新时为 null
          example: '2026-09-07 11:00:00'
        activity_status:
          type: string
          readOnly: true
          enum: [not_started, ongoing, ended]
          description: 动态活动状态；开始前、开始至结束时刻（含边界）、结束后分别对应三个枚举值
          example: ongoing

    PromotionCreateInput:
      type: object
      additionalProperties: false
      description: |
        创建促销活动请求体；仅允许下列业务字段，未知字段及只读字段会被拒绝。
        limit_type=0 时 limit_quantity 必须为 null 或不传；limit_type=1 时 limit_quantity 必须为正整数。
        start_time 和 end_time 可传正整数 Unix 秒、纯数字字符串或可解析的日期时间字符串（如 YYYY-MM-DD HH:mm:ss）。
      required:
        - activity_name
        - start_time
        - end_time
      properties:
        activity_name:
          type: string
          minLength: 1
          description: 活动名称；服务端会移除首尾空格
          example: 国庆满减活动
        start_time:
          oneOf:
            - type: integer
              minimum: 1
            - type: string
          description: 活动开始时间，最终按 Unix 秒存储
          example: '2026-10-01 00:00:00'
        end_time:
          oneOf:
            - type: integer
              minimum: 1
            - type: string
          description: 活动结束时间，必须晚于 start_time，最终按 Unix 秒存储
          example: '2026-10-07 23:59:59'
        order_close_time:
          type: integer
          minimum: 1
          description: 未支付订单自动关闭时长，单位为秒
          default: 1800
          example: 1800
        limit_type:
          type: integer
          enum: [0, 1]
          description: 限购类型，0=不限购，1=每人限购
          default: 0
          example: 1
        limit_quantity:
          type: integer
          minimum: 1
          nullable: true
          description: 每人限购数量；不限购时必须为 null，限购时必须为正整数
          example: 2
        allow_full_discount:
          type: integer
          enum: [0, 1]
          description: 是否可叠加满减满折，0=不可用，1=可用
          default: 0
          example: 1
        allow_coupon:
          type: integer
          enum: [0, 1]
          description: 是否可叠加优惠券，0=不可用，1=可用
          default: 0
          example: 1

    PromotionUpdateInput:
      type: object
      minProperties: 1

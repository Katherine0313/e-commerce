          schema:
            type: string
            enum: [created_at, pay_at, updated_at, ship_at, confirm_at, finish_at]
        - name: start_date
          in: query
          required: false
          description: 开始时间，格式 YYYY-MM-DD HH:mm
          schema:
            type: string
            example: '2026-08-01 00:00'
        - name: end_date
          in: query
          required: false
          description: 结束时间，格式 YYYY-MM-DD HH:mm
          schema:
            type: string
            example: '2026-08-28 23:59'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array

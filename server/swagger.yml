          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          tagId:
                            type: string
                            example: 1
                          count:
                            type: integer
                            description: 本次实际传入的商品数
                            example: 3
        '400':
          description: product_ids 必传
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - 标签
      summary: 批量解绑标签商品

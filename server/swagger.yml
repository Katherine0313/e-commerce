        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AfterSaleInput'
      responses:
        '200':
          description: 申请成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AfterSale'
        '400':
          description: 参数缺失或订单状态不允许申请售后
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    get:
      tags:
        - 售后
      summary: 售后列表
      description: |
        按状态、关键词、申请时间范围筛选售后记录。
        关键词 search 同时匹配：订单号 / 售后单号 / 收货人姓名 / 手机号。
        日期范围 date_field 默认 created_at（主表），也可指定 updated_at。
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          description: 售后状态，不传返回全部
          schema:
            type: string
            enum: [reviewing, refunding, refund_confirming, exchanging, returning, refunded, exchanged, returned, rejected]
        - name: search
          in: query
          required: false
          description: 模糊搜索关键词，匹配订单号、售后单号、收货人姓名、手机号
          schema:
            type: string
        - name: date_field
          in: query
          required: false
          description: 日期筛选字段，默认 created_at（售后创建时间）
          schema:
            type: string
            enum: [created_at, updated_at]
        - name: start_date
          in: query
          required: false
          description: 开始时间，格式 YYYY-MM-DD HH:mm
          schema:
            type: string
            example: '2026-08-01 00:00'
        - name: end_date
          in: query
          required: false
          description: 结束时间，格式 YYYY-MM-DD HH:mm
          schema:
            type: string
            example: '2026-08-28 23:59'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/AfterSale'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/after-sales/{id}/submit-return:
    post:
      tags:
        - 售后
      summary: 用户提交退货方式
      description: |
        仅当售后单状态为 `returning`（商家审核通过 + 进入退货阶段）时可调用。
        提交成功后写入 `after_sale_returns`（return_refund / only_refund）或 `after_sale_exchange_returns`（exchange）表，
        并把 status 自动从 `returning` 推进到 `refunding`（仅退款/退货退款；换货保持 `returning` 等商家确认收货）。
        再次调用会拒绝（已提交）。
        - 上门取件（pickup）必须指定 return_time_slot（morning/afternoon）
        - 自行寄回（self）return_time_slot 可为空
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - return_way
              properties:
                return_way:
                  type: string
                  description: 退货方式
                  enum: [pickup, self]
                  example: pickup
                return_time_slot:
                  type: string
                  nullable: true
                  description: 取件时间段（pickup 时必填，self 时可空）
                  enum: [morning, afternoon, null]
                  example: morning
      responses:
        '200':
          description: 提交成功，返回更新后的售后记录
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AfterSale'
        '400':
          description: 参数不合法 / 状态不对 / 已提交过
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'


  # ==================== 库存预警 ====================
  /api/stock:
    post:
      tags:
        - 库存预警
      summary: 创建库存预警配置
      description: |
        为某个商品（按 product_id 关联）创建预警配置。
        每个 product_id 只能有一条配置；若该商品已存在配置，则自动转为更新。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockInput'
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Stock'
        '400':
          description: 参数校验失败 / product_id 不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    get:
      tags:
        - 库存预警
      summary: 获取库存预警列表
      description: |
        返回所有配过预警的商品 + 当前库存 + 阈值 + 计算出的预警状态。
        预警状态：normal（正常）/ low（低库存）/ over（超储）/ off（未开预警）。
        当前库存 current_stock 来自 products.stock，本表只存预警配置。
      parameters:
        - in: query
          name: search
          required: false
          schema:
            type: string
          description: 商品名模糊搜索关键字（LIKE %keyword%，大小写不敏感），不传或空字符串返回全部
          example: iPhone
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/StockListItem'
  /api/stock/candidates:
    get:
      tags:
        - 库存预警
      summary: 获取还没配预警的商品
      description: |
        返回所有尚未配置库存预警的商品，作为「新增预警」时的候选项。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/StockCandidate'
  /api/stock/status-constants:
    get:
      tags:
        - 库存预警
      summary: 获取库存状态常量
      description: 返回库存状态中文映射和标签配色，前端启动时调用一次
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      map:
                        type: object
                        description: 库存状态 key → 中文
                        properties:
                          high:
                            type: string
                            example: 高库存
                          normal:
                            type: string
                            example: 正常
                          low:
                            type: string
                            example: 低库存
                      color:
                        type: object
                        description: 库存状态 key → Tag 颜色
                        properties:
                          high:
                            type: string
                            example: blue
                          normal:
                            type: string
                            example: green
                          low:
                            type: string
                            example: red
                  message:
                    type: string
                    nullable: true
  /api/stock/by-product/{productId}:
    get:
      tags:
        - 库存预警
      summary: 按商品 ID 查询预警配置
      parameters:
        - name: productId
          in: path
          required: true
          description: 商品表 ID
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Stock'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/stock/{id}:
    get:
      tags:
        - 库存预警
      summary: 按预警配置 ID 查询单条
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Stock'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
        - 库存预警
      summary: 更新库存预警配置（部分字段）
      description: |
        字段未传则保持原值。校验规则：
          - alert_enabled=1 时必须同时填 min_stock 和 max_stock，且 min ≤ max
          - min_stock / max_stock 非空时必须是非负数
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockInput'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Stock'
        '400':
          description: 校验失败（如阈值缺失 / min>max）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - 库存预警
      summary: 删除库存预警配置（物理删除）
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ==================== 促销 ====================
  /api/business-onsale:
    get:
      tags:
        - 促销
      summary: 获取促销活动列表
      description: 按创建时间和 ID 倒序返回促销活动，并根据当前时间动态计算活动状态；search 仅接受字符串。
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          required: false
          description: 活动名称模糊搜索关键字；不传或传空字符串时返回全部
          schema:
            type: string
          example: 国庆
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Promotion'
        '400':
          description: search 不是字符串
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
        - 促销
      summary: 创建促销活动
      description: 创建一条促销活动；仅管理员可操作，未知字段及只读字段会被拒绝。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromotionCreateInput'
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Promotion'
        '400':
          description: 请求体、字段格式或业务规则校验失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/business-onsale/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: 促销活动 ID
        schema:
          type: integer
          minimum: 1
        example: 1
    get:
      tags:
        - 促销
      summary: 获取促销活动详情
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Promotion'
        '400':
          description: ID 不是正整数
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
        - 促销
      summary: 局部更新促销活动
      description: |
        仅管理员可操作；至少提交一个可修改字段，未提交的字段保持原值。
        未知字段以及 id、created_at、updated_at、activity_status 等只读字段会被拒绝。
        切换 limit_type 时必须同时提交与新类型匹配的 limit_quantity。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromotionUpdateInput'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Promotion'
        '400':
          description: ID、请求体、字段格式或业务规则校验失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - 促销
      summary: 删除促销活动
      description: 物理删除指定促销活动；仅管理员可操作。
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      message:
                        type: string
                        example: 删除成功
        '400':
          description: ID 不是正整数
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 使用 Bearer Token 进行身份验证，格式为 'Bearer {token}'
  responses:
    Unauthorized:
      description: 未登录 / Token失效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
    Forbidden:
      description: 权限不足
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
  schemas:
    ApiResponse:
      type: object
      description: 通用 API 响应包装
      properties:
        success:
          type: boolean
          description: 请求是否成功
        data:
          description: 响应数据（任意类型）
        message:
          type: string
          nullable: true
          description: 提示信息
    Shop:
      type: object
      description: 店铺（隔离单位）。id = 1 为模板店，其余为访客的体验沙箱
      properties:
        id:
          type: integer
          description: 店铺 id，也是数据隔离键（接口内部按它过滤，不接受调用方传参）
          example: 1
        name:
          type: string
          description: 店铺名称
          example: 杰米小店
        is_template:
          type: boolean
          description: 是否模板店（模板店永不过期，且是所有沙箱的数据来源）
          example: true
        created_at:
          type: integer
          description: 创建时间（秒级时间戳）
          example: 1789453491
        expires_at:
          type: integer
          nullable: true
          description: 到期时间（秒级时间戳）；模板店为 null 表示永不过期
          example: null
    Product:
      type: object
      properties:
        id:
          type: integer
          description: 商品ID
          example: 1
        name:
          type: string
          description: 商品名称
          example: iPhone 15 Pro
        brand:
          type: string
          description: 商品品牌
          example: 苹果
        sub_title:
          type: string
          description: 商品副标题
          example: 最新款苹果手机
        price:
          type: number
          description: 商品价格（兼容旧字段，等同于 sales_price）
          example: 9999
        description:
          type: string
          description: 商品描述
          example: 最新款苹果手机
        category_id:
          type: integer
          description: 商品分类ID，外键关联分类表，通常为最细一级（如 2011=游戏本）
          example: 101
        stock:
          type: integer
          description: 库存数量
          example: 100
        image:
          type: string
          description: 商品图片URL
          example: https://images.unsplash.com/photo-1695048133142-1a20484d2569?w=400&h=400&fit=crop
        body:
          type: string
          description: 商品图文详情（富文本 HTML）
          example: <p>这是一段商品详情</p>
        sales_mode:
          type: string
          description: 销售模式（spot=现货，presell=预售）
          example: spot
        listing_status:
          type: integer
          description: 上架状态（1=上架，0=下架）
          example: 1
        sales_price:
          type: number
          description: 销售价
          example: 9999
        market_price:
          type: number
          nullable: true
          description: 市场价
          example: 10999
        cost_price:
          type: number
          nullable: true
          description: 成本价
          example: 7999
        product_code:
          type: string
          nullable: true
          description: 商品编码（商家自定义 SPU/SKU 编码）
          example: SPU-001
        weight:
          type: number
          nullable: true
          description: 重量（kg）
          example: 0.5
        volume:
          type: number
          nullable: true
          description: 体积（m³）
          example: 0.02
        created_at:
          type: string
          format: date-time
          description: 创建时间（仅新创建商品有）
        updated_at:
          type: string
          format: date-time
          nullable: true
          description: 更新时间（未更新过为 null）
        tag_name:
          type: string
          nullable: true
          description: 商品关联标签名称，无标签时为 null
          example: 爆款
        shop_id:
          type: integer
          description: 所属店铺 id（隔离键，由 token 决定，不接受调用方传参）
          example: 1
    ProductInput:
      type: object
      required:
        - name
        - brand
        - sub_title
        - sales_price
        - category_id
        - stock
      properties:
        name:
          type: string
          description: 商品名称
          example: iPhone 15 Pro
        brand:
          type: string
          description: 商品品牌
          example: 苹果
        sub_title:
          type: string
          description: 商品副标题
          example: 最新款苹果手机
        sales_price:
          type: number
          description: 销售价
          example: 9999
        description:
          type: string
          description: 商品描述
          example: 最新款苹果手机
        category_id:
          type: integer
          minimum: 1
          description: 商品分类ID（必填，须为正整数）
          example: 101
        stock:
          type: integer
          description: 库存数量
          example: 100
        image:
          type: string
          description: 商品图片URL
          example: https://images.unsplash.com/photo-1695048133142-1a20484d2569?w=400&h=400&fit=crop
        body:
          type: string
          description: 商品图文详情（富文本 HTML）
          example: <p>这是一段商品详情</p>
        sales_mode:
          type: string
          description: 销售模式（spot=现货，presell=预售），默认 spot
          example: spot
        listing_status:
          type: integer
          description: 上架状态（1=上架，0=下架），默认 1
          example: 1
        market_price:
          type: number
          description: 市场价
          example: 10999
        cost_price:
          type: number
          description: 成本价
          example: 7999
        product_code:
          type: string
          description: 商品编码（商家自定义 SPU/SKU 编码）
          example: SPU-001
        weight:
          type: number
          description: 重量（kg）
          example: 0.5
        volume:
          type: number
          description: 体积（m³）
          example: 0.02
    CategoryNode:
      type: object
      properties:
        id:
          type: integer
          description: 分类ID
          example: 1
        label:
          type: string
          description: 分类名称
          example: 手机
        sort_index:
          type: integer
          description: 同级内的序号（1、2、3……），由服务端按当前顺序实时计算，删除同级分类后自动连续，列表展示用这个值
          example: 1
        sort_order:
          type: integer
          nullable: true
          description: 排序值，仅作为顺序依据，通过 /move 接口调整，不用于展示
          example: 1
        status:
          type: integer
          nullable: true
          description: 是否在网店显示（1=显示，0=隐藏，null=未设置）
          example: 1
        product_count:
          type: integer
          description: 关联产品数
          example: 5
        children:
          type: array
          description: 子分类列表
          items:
            $ref: '#/components/schemas/CategoryNode'
          example: []
    ValidationError:
      type: object
      description: 参数校验失败响应，多个错误以分号拼接
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: 商品分类不能为空;商品名称不能为空
    UnauthorizedError:
      type: object
      description: 未登录或 token 无效
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: 未登录
    ForbiddenError:
      type: object
      description: 无权限操作
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: 无权限操作，仅管理员可执行
    Tag:
      type: object
      properties:
        id:
          type: integer
          description: 标签ID
          example: 1
        name:
          type: string
          description: 标签名称
          example: 热销
        code:
          type: string
          description: 标签编码
          example: hot
        type:
          type: string
          description: 标签类型
          example: custom
        color:
          type: string
          description: 标签颜色
          example: '#ff4d4f'
        sort_order:
          type: integer
          description: 排序序号
          example: 1
        status:
          type: integer
          description: 状态，1=启用，0=禁用
          example: 1
        product_count:
          type: integer
          description: 关联商品数
          example: 12
        created_at:
          type: string
          format: date-time
          description: 创建时间
        updated_at:
          type: string
          format: date-time
          description: 更新时间
        created_by:
          type: integer
          nullable: false
          description: 创建人ID（由后端从 JWT 自动填充，不接受请求体传入）
          example: 1
        updated_by:
          type: integer
          nullable: false
          description: 更新人ID（由后端从 JWT 自动填充，不接受请求体传入）
          example: 1
    TagInput:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: 标签名称
          example: 热销
        code:
          type: string
          description: 标签编码（唯一）
          example: hot
        type:
          type: string
          description: 标签类型

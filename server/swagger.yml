openapi: 3.0.3
info:
  title: 电商后端 API
  description: |
    电商后端 API Mock 服务文档

    ## 多店铺隔离（上线演示用沙箱）

    服务是多租户的：所有业务数据按「店铺」隔离，隔离键是 `shop_id`。

    - **`shopId` 全部来自 token**。调用方**不需要也无法**传店铺参数（query / body / header 里的
      店铺参数一律被忽略），服务端只认自己签发的 JWT 里的 `shopId`。
    - 访客点「一键体验」调 `POST /api/shops/sandbox` 拿到一个**独立沙箱店铺**的 token，
      该店铺预置了一整份演示数据、24 小时后自动回收，与其他访客完全互不可见。
    - `admin / admin123` 登录进的是 `shop_id = 1` 的**模板店**，是所有沙箱的数据来源。
    - 未携带 token 的公开 GET 接口（商品、分类、标签、库存的查询）返回**模板店**的数据，
      与改造前的浏览行为一致。
    - 过期或已被回收的沙箱，其 token 再调任何接口都会得到 `401`。
  version: 1.0.0
servers:
  - url: http://localhost:3000
    description: 本地开发服务器
tags:
  - name: 认证
    description: 用户认证相关接口
  - name: 商品
    description: 商品管理相关接口
  - name: 上传
    description: 文件上传相关接口
  - name: 标签
    description: 商品标签管理相关接口
  - name: 分类
    description: 商品分类管理相关接口
  - name: 收货地址
    description: 收货地址管理相关接口
  - name: 购物车
    description: 购物车管理相关接口
  - name: 订单
    description: 订单管理相关接口
  - name: 售后
    description: 售后管理相关接口
  - name: 库存预警
    description: 商品库存预警配置管理接口（上下限、开关、列表）
  - name: 促销
    description: 促销活动管理接口
  - name: 店铺
    description: 店铺（体验沙箱）相关接口。隔离键 shopId 来自 token，调用方无需传店铺参数
paths:

  # ==================== 店铺 ====================
  /api/shops/sandbox:
    post:
      tags:
        - 店铺
      summary: 一键体验（开通体验沙箱店铺）
      description: |
        公开接口，不需要登录。为本次访客开通一个**全新的**独立沙箱店铺：
        克隆模板店的整套演示数据（商品/分类/标签/库存/订单/售后等），
        并直接签发一个该店铺的管理员 token（拥有该店铺内的全部权限）。

        每次调用都开新店铺、不复用旧沙箱；有效期 24 小时，到期后由服务端定时回收
        （数据行、店铺记录、上传文件一并清理）。

        受限流约束：同一 IP 每小时最多开通若干次，超出返回 429。
      responses:
        '200':
          description: 开通成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          token:
                            type: string
                            description: 该沙箱店铺的管理员 JWT token（后续请求都带它）
                            example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                          user:
                            type: object
                            properties:
                              id:
                                type: integer
                                example: 3000001
                              username:
                                type: string
                                description: 带店铺后缀，不与模板店 admin 冲突
                                example: admin_s3
                              name:
                                type: string
                                example: 管理员
                              role:
                                type: string
                                example: admin
                          shop:
                            $ref: '#/components/schemas/Shop'
                      message:
                        type: string
                        example: 体验店铺已开通
        '429':
          description: 开通过于频繁（同 IP 超出限额）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '500':
          description: 开通失败（克隆异常等）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
  /api/shops/current:
    get:
      tags:
        - 店铺
      summary: 获取当前店铺信息
      description: 返回 token 所属店铺的 id、名称、是否模板店与到期时间，供前端顶栏/店铺卡片展示沙箱店名与剩余有效期
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 响应
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Shop'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ==================== 认证 ====================
  /api/login:
    post:
      tags:
        - 认证
      summary: 用户登录
      description: 使用用户名和密码进行登录，返回 JWT token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                  description: 用户名
                  example: admin
                password:
                  type: string
                  description: 密码
                  example: admin123
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          token:
                            type: string
                            description: JWT token
                            example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                          user:
                            type: object
                            properties:
                              id:
                                type: integer
                                example: 1
                              username:
                                type: string
                                example: admin
                              name:
                                type: string
                                example: 管理员
                              role:
                                type: string
                                example: admin
                          shop:
                            description: 登录账号所属店铺；token 里的 shopId 即取自这里，决定能读写哪些数据
                            allOf:
                              - $ref: '#/components/schemas/Shop'
        '401':
          description: 登录失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
  /api/register:
    post:
      tags:
        - 认证
      summary: 用户注册
      description: 用户注册，保存到 SQLite 数据库
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
                - phone
              properties:
                username:
                  type: string
                  description: 用户名
                  example: newuser
                password:
                  type: string
                  description: 密码
                  example: password123
                phone:
                  type: string
                  description: 手机号
                  example: 13800138000
      responses:
        '200':
          description: 注册成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          token:
                            type: string
                            description: JWT token
                            example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                          user:
                            type: object
                            properties:
                              id:
                                type: integer
                                example: 3
                              username:
                                type: string
                                example: newuser
                              phone:
                                type: string
                                example: '13800138000'
                              role:
                                type: string
                                example: user
                      message:
                        type: string
                        example: 注册成功
        '400':
          description: 注册失败（参数校验不通过或用户名已存在）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
  /api/user/info:
    get:
      tags:
        - 认证
      summary: 获取当前用户信息
      description: 获取当前登录用户的信息（返回 token 里的载荷，含 shopId —— 前端据此判断当前所在店铺）
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 响应
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 1
                          username:
                            type: string
                            example: admin
                          role:
                            type: string
                            example: admin
                          shopId:
                            type: integer
                            description: 当前店铺 id（隔离键，由服务端签发在 token 里）
                            example: 1
                          iat:
                            type: integer
                            description: token 签发时间（秒级时间戳）
                            example: 1789454521
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/logout:
    post:
      tags:
        - 认证
      summary: 用户登出
      description: 用户登出
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 响应
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      message:
                        type: string
                        example: 登出成功

  # ==================== 商品 ====================
  /api/products:
    get:
      tags:
        - 商品
      summary: 获取全部商品列表
      description: 获取全部商品列表（不分页），支持按分类和搜索筛选
      parameters:
        - name: category_id
          in: query
          description: 商品分类ID，匹配该分类及其所有后代分类下的商品
          required: false
          schema:
            type: integer
            example: 1
        - name: search
          in: query
          description: 搜索关键词
          required: false
          schema:
            type: string
            example: iPhone
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Product'
                      total:
                        type: integer
                        description: 符合条件的商品总数
                        example: 52
    post:
      tags:
        - 商品
      summary: 创建商品
      description: 创建新商品
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Product'
                      message:
                        type: string
        '400':
          description: 请求参数校验失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '401':
          description: 未登录或 token 无效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '403':
          description: 无权限，仅管理员可操作
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
  /api/products/brands:
    get:
      tags:
        - 商品
      summary: 获取商品品牌
      description: 获取所有商品品牌（去重）
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: string
                        example: ['苹果', '小米', '华为', 'OPPO', 'vivo', '戴尔', '联想']
  /api/products/dashboard:
    get:
      tags:
        - 商品
      summary: 获取仪表盘数据
      description: 获取仪表盘统计数据。只统计**当前 token 所属店铺**的数据（含成本价等经营字段，不会出现其他店铺的数据）
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          totalProducts:
                            type: integer
                            example: 50
                          totalStock:
                            type: integer
                            example: 6500
                          totalValue:
                            type: number
                            example: 2580000
                          products:
                            type: array
                            items:
                              $ref: '#/components/schemas/Product'
                      message:
                        type: string
  /api/products/{id}:
    get:
      tags:
        - 商品
      summary: 获取单个商品详情
      description: |
        根据ID获取商品详情
        注：返回字段 tag_name 为商品关联的标签名称，无标签时为 null
      parameters:
        - name: id
          in: path
          required: true
          description: 商品ID
          schema:
            type: string
            example: 1
      responses:
        '200':
          description: 响应
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Product'
                      message:
                        type: string
                        example: 商品不存在
    put:
      tags:
        - 商品
      summary: 更新商品
      description: 更新商品信息
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: 商品ID
          schema:
            type: string
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        '200':
          description: 响应
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Product'
                      message:
                        type: string
                        example: 商品不存在
        '400':
          description: 请求参数校验失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '401':
          description: 未登录或 token 无效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '403':
          description: 无权限，仅管理员可操作
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
    delete:
      tags:
        - 商品
      summary: 删除商品
      description: 删除商品
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: 商品ID
          schema:
            type: string
            example: 1
      responses:
        '200':
          description: 响应
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      message:
                        type: string
                        example: 删除成功
        '401':
          description: 未登录或 token 无效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '403':
          description: 无权限，仅管理员可操作
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
  # ==================== 分类 ====================
  /api/categories:
    get:
      tags:
        - 分类
      summary: 获取所有分类
      description: 获取所有商品分类
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/CategoryNode'
    post:
      tags:
        - 分类
      summary: 创建分类
      description: 新增一个商品分类，排序值由服务端计算并自动追加到同级末尾
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  description: 分类名称
                  example: 新分类
                parent_id:
                  type: integer
                  description: 父分类ID（顶级分类不传）
                  example: 59
                status:
                  type: integer
                  description: 状态（1=显示，0=隐藏）
                  example: 1
                image:
                  type: string
                  description: 分类图片URL
                  example: http://localhost:3000/uploads/abc123.png
                recommend:
                  type: integer
                  description: 热门推荐（1=是，0=否）
                  example: 1
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CategoryNode'
        '400':
          description: 参数校验失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/categories/flat:
    get:
      tags:
        - 分类
      summary: 获取分类扁平列表
      description: 返回不带树形结构的分类列表，每条记录包含 parent_id 字段，便于前端按父子关系自行处理或筛选顶级分类
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                              description: 分类ID
                              example: 1
                            name:
                              type: string
                              description: 分类名称
                              example: 手机
                            parent_id:
                              type: integer
                              nullable: true
                              description: 父分类ID，顶级分类为 null
                              example: null
                            sort_order:
                              type: integer
                              nullable: true
                              description: 排序（二级分类为 null，由箭头调整时写入）
                              example: 1
                            status:
                              type: integer
                              description: 状态（1=显示，0=隐藏）
                              example: 1
                            image:
                              type: string
                              nullable: true
                              description: 分类图片URL
                              example: http://localhost:3000/uploads/abc123.png
                            recommend:
                              type: integer
                              description: 热门推荐（1=是，0=否）
                              example: 1
  /api/categories/{id}/move:
    post:
      tags:
        - 分类
      summary: 上移或下移分类
      description: 在同一父分类下将目标分类上移或下移一位
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: 分类ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - direction
              properties:
                direction:
                  type: string
                  enum: [up, down]
                  description: 移动方向
                  example: up
      responses:
        '200':
          description: 调整成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      message:
                        type: string
                        example: 分类顺序调整成功
        '400':
          description: 分类ID或移动方向不合法
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 分类已位于同级列表边界
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '500':
          description: 服务器内部错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /api/categories/{id}:
    get:
      tags:
        - 分类
      summary: 获取单个分类
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: 分类ID
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CategoryNode'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
        - 分类
      summary: 更新分类
      description: 更新分类的名称、父级、状态等信息；排序值不接受前端传入，请调用 POST /api/categories/{id}/move 调整
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: 分类ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: 更新后的分类
                parent_id:
                  type: integer
                  example: 59
                status:
                  type: integer
                  example: 1
                image:
                  type: string
                  description: 分类图片URL

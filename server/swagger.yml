      description: |
        促销活动局部更新请求体，至少提交一个下列业务字段；未提交的字段保持原值。
        未知字段以及 id、created_at、updated_at、activity_status 等只读字段会被拒绝。
        limit_type=0 时 limit_quantity 必须为 null，limit_type=1 时必须为正整数；切换类型时二者必须同时提交。
        start_time 和 end_time 可传正整数 Unix 秒、纯数字字符串或可解析的日期时间字符串（如 YYYY-MM-DD HH:mm:ss）。
      properties:
        activity_name:

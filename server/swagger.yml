  # ==================== 售后 ====================
  /api/after-sales:
    post:
      tags:
        - 售后
      summary: 申请售后
      description: |
        为「已发货」或「已完成」的订单发起售后申请。
        - 售后类型不传时默认 return_refund（退货退款）
        - 创建后初始状态：所有售后类型统一为 reviewing（商家审核中）

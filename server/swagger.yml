    AfterSale:
      type: object
      description: 售后记录
      properties:
        id:
          type: integer
          description: 售后记录ID
          example: 1
        order_id:
          type: integer
          description: 关联订单ID
          example: 3
        order_no:
          type: string
          description: 订单号
          example: '202408130001'
        after_sale_no:
          type: string
          description: 售后单号
          example: AS20240814125252
        after_sale_type:
          type: string
          description: 售后类型
          enum: [only_refund, return_refund, exchange]
          example: return_refund
        reason:
          type: string
          description: 售后原因
          example: 商品有瑕疵
        remark:
          type: string
          description: 补充说明
          example: 请尽快处理
        merchant_remark:
          type: string
          description: 商家备注（审核时填写）
          example: 已审核通过，退款原路返回
        images:
          type: array
          description: 凭证图片 URL 列表
          items:
            type: string
          example: ['https://example.com/a.jpg']
        status:
          type: string
          description: 售后状态
          enum: [reviewing, refunding, refund_confirming, exchanging, returning, refunded, exchanged, returned, rejected]
          example: reviewing
        order_status:
          type: string
          description: 申请售后时订单状态的快照（如 cancel/shipped/finished）
          example: cancel
        pay_at:
          type: string
          nullable: true
          description: 付款时间
          example: '2024-08-13 10:00:00'
        confirm_at:
          type: string
          nullable: true
          description: 确认收款时间
          example: '2024-08-13 11:00:00'
        ship_at:
          type: string
          nullable: true
          description: 发货时间
          example: '2024-08-13 14:00:00'
        finish_at:
          type: string
          nullable: true
          description: 完成时间
          example: '2024-08-14 09:00:00'
        review_at:
          type: string
          nullable: true
          description: |
            审核时间（商家审批售后时写入，null 表示未审核）。
            来源：return_refund/only_refund → `after_sale_returns`/`after_sale_only_refunds`；
            exchange → `after_sale_exchange_returns`。
          example: '2024-08-14 10:00:00'
        refund_at:
          type: string
          nullable: true
          description: |
            确认退款时间（仅退款/退货退款专用，商家确认退款时写入，null 表示未确认）。
            来源：return_refund → `after_sale_returns`；only_refund → `after_sale_only_refunds`。
          example: '2024-08-14 11:00:00'
        refunded_at:
          type: string
          nullable: true
          description: |
            退款成功时间（仅退款/退货退款专用，null 表示未退款）。
            来源：return_refund → `after_sale_returns`；only_refund → `after_sale_only_refunds`。
          example: '2024-08-14 12:00:00'
        rejected_at:
          type: string
          nullable: true
          description: |
            拒绝时间（商家拒绝售后时写入，null 表示未拒绝）。
            来源：return_refund/only_refund/exchange → 对应子表。
          example: '2024-08-14 10:30:00'
        return_at:
          type: string
          nullable: true
          description: |
            用户提交退货方式的时间。
            取自 `after_sale_returns`（only_refund / return_refund）或 `after_sale_exchange_returns`（exchange），null 表示未提交。
          example: '2024-08-14 10:30:00'
        return_way:
          type: string
          nullable: true
          description: |
            退货方式（pickup 上门取件 / self 自行寄回）。
            取自 `after_sale_returns` 或 `after_sale_exchange_returns`。
          enum: [pickup, self, null]
          example: pickup
        return_time_slot:
          type: string
          nullable: true
          description: |
            取件时间段（morning 09:00‑13:00 / afternoon 13:00‑19:00；自行寄回时为 null）。
            取自 `after_sale_returns` 或 `after_sale_exchange_returns`。
          enum: [morning, afternoon, null]
          example: morning
        exchange_at:
          type: string
          nullable: true
          description: |
            商家确认收到退货、开始换货的时间（仅换货售后有值）。
            取自 `after_sale_exchange_returns.exchange_at`，null 表示商家尚未确认收到。
          example: '2026-08-26 15:30:00'
        exchanged_at:
          type: string
          nullable: true
          description: |
            换货完成时间（仅换货售后有值）。
            取自 `after_sale_exchange_returns.exchanged_at`，null 表示换货未完成。
          example: '2026-08-27 10:30:00'
        created_at:
          type: string
          description: 创建时间
          example: '2024-08-13 12:00:00'
        updated_at:
          type: string
          description: 更新时间
          example: '2024-08-13 12:00:00'
        consignee:
          type: string
          nullable: true
          description: 收货人姓名（运行时从关联 orders 表读取，非快照）
          example: 宗小杰
        phone:
          type: string
          nullable: true
          description: 收货人电话（运行时从关联 orders 表读取，非快照）
          example: '13900139011'
        region:
          type: string
          nullable: true
          description: 收货地区（运行时从关联 orders 表读取，非快照）
          example: 北京市 市辖区 东城区
        detail_address:
          type: string
          nullable: true
          description: 详细地址（运行时从关联 orders 表读取，非快照）
          example: 建国路888号
        pay_type:
          type: string
          nullable: true
          description: 支付方式（中文，运行时从关联 orders 表读取，非快照）
          example: 微信
        pay_amount:
          type: number
          nullable: true
          description: 实付金额（运行时从关联 orders 表读取，非快照）
          example: 17998
